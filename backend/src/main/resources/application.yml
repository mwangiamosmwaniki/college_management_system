server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 8h
      cookie:
        name: COLLEGE_ERP_SESSION
        http-only: true
        secure: true
        same-site: lax

spring:
  application:
    name: college-management-backend
  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/college_erp_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:test_user}
    password: ${MAIL_PASSWORD:test_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
    session-timeout-seconds: 28800
    rate-limit:
      requests-per-minute: 60
      login-attempts-max: 5
      lockout-duration-seconds: 900
  mpesa:
    env: ${MPESA_ENV:sandbox}
    consumer-key: ${MPESA_CONSUMER_KEY:sandbox_consumer_key}
    consumer-secret: ${MPESA_CONSUMER_SECRET:sandbox_consumer_secret}
    passkey: ${MPESA_PASSKEY:bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
    shortcode: ${MPESA_SHORTCODE:174379}
    callback-url: ${MPESA_CALLBACK_URL:https://api.institution.edu/api/v1/payments/mpesa/callback}
  storage:
    type: s3
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:college-erp-documents}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
